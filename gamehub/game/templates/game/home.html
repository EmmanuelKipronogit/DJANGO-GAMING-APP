{% extends "base.html" %}
{% block content %}
<section class="card hero">
  <h1>Can you guess the number?</h1>
  <p>I'm thinking of a number between 1 and 100. You get {{ max_attempts }} guesses, and I'll tell you
     whether to go higher or lower after each one. Fewer guesses means more points.</p>
  <p>
    <a class="btn" href="{% url 'signup' %}">Create an account</a>
    <a class="btn secondary" href="{% url 'login' %}">Log in</a>
  </p>
</section>
{% endblock %}
